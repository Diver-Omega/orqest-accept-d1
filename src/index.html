<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一覧</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  main { box-sizing: border-box; width: 100%; max-width: 720px; margin: 0 auto; padding: 16px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>一覧</h1>
  <ul id="list"></ul>
</main>
<script type="module">
import { View } from './list.mjs'

const result = await fetch('/api/items')
  .then(async (response) => ({ ok: response.ok, items: response.ok ? await response.json() : [] }))
  .catch(() => ({ ok: false, items: [] }))
document.getElementById('list').innerHTML = View(result)
</script>
</body>
</html>
